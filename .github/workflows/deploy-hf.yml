name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install -U huggingface_hub

      - name: Create Space if missing, then push code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          user = api.whoami()["name"]
          repo_id = f"{user}/money-mate"
          print(f"Hugging Face account: {user}")
          # 创建公开的 Docker Space（已存在则复用）
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="docker",
              private=False,
              exist_ok=True,
          )
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"HF_REPO={repo_id}\n")
          PY
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/${HF_REPO}" 2>/dev/null \
            || git remote set-url hf "https://user:${HF_TOKEN}@huggingface.co/${HF_REPO}"
          git push -f hf main
