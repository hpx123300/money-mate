# Render 一键部署配置（免费 Web Service）
# 用法：render.com → New → Blueprint → 选择本仓库 → Apply
services:
  - type: web
    name: youshu
    runtime: docker
    repo: https://github.com/hpx123300/money-mate
    branch: main
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # 固定 JWT 密钥：不设的话每次重启都会随机生成，已登录用户全部掉线
      - key: APP_SECRET_KEY
        generateValue: true
      # LLM Key 手动在 Render 控制台填，不要写进仓库
      - key: LLM_API_KEY
        sync: false
