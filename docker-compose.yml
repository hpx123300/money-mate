services:
  web:
    build: .
    container_name: moneymate-web
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      # 持久化 SQLite 数据库，容器重建数据不丢
      - moneymate-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: moneymate-redis
    restart: unless-stopped

volumes:
  moneymate-data:
